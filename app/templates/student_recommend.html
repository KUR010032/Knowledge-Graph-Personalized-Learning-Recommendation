<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>学习资源推荐 - {{ student_name }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif; background-color: #f0f2f5; color: #333; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 200px; background: #2c3e50; color: white; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #34495e; }
        .sidebar-header h3 { font-size: 15px; margin-bottom: 5px; font-weight: normal; color: #ecf0f1; }
        .sidebar-header .user-badge { font-size: 12px; color: #95a5a6; }
        
        .nav-menu { flex: 1; padding: 10px 0; overflow-y: auto; }
        .nav-item { padding: 12px 20px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 14px; text-decoration: none; color: #bdc3c7; border-left: 3px solid transparent; }
        .nav-item:hover { background: #34495e; color: white; }
        .nav-item.active { background: #34495e; color: white; border-left-color: #3498db; }
        .nav-item i { width: 18px; text-align: center; font-size: 16px; }
        
        .sidebar-footer { padding: 15px 20px; border-top: 1px solid #34495e; }
        .logout-btn { width: 100%; padding: 8px; background: #e74c3c; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 13px; }
        .logout-btn:hover { background: #c0392b; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { background: white; padding: 12px 20px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .top-bar h2 { color: #333; font-size: 16px; font-weight: normal; }
        .top-bar .refresh { padding: 6px 14px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        
        .content-area { flex: 1; padding: 20px; overflow-y: auto; }

        .summary-card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .summary-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .summary-title { font-size: 18px; font-weight: bold; color: #2c3e50; }
        .recommend-type { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; white-space: nowrap; }
        .type-excellent { background: #d5f4e6; color: #27ae60; }
        .type-medium { background: #fef9e7; color: #f39c12; }
        .type-weak { background: #ebf5fb; color: #3498db; }
        .recommend-basis { font-size: 13px; color: #7f8c8d; margin-bottom: 14px; line-height: 1.6; padding: 10px 14px; background: #f8f9fa; border-radius: 6px; border-left: 3px solid #3498db; }
        .summary-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        .stat-item { text-align: center; padding: 12px 8px; background: #f8f9fa; border-radius: 8px; }
        .stat-value { font-size: 22px; font-weight: bold; color: #2c3e50; }
        .stat-value.low { color: #e74c3c; }
        .stat-value.medium { color: #f39c12; }
        .stat-value.high { color: #27ae60; }
        .stat-label { font-size: 12px; color: #7f8c8d; margin-top: 4px; }
        
        .target-card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 4px solid #3498db; }
        .target-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .target-title { font-size: 16px; font-weight: bold; color: #2c3e50; }
        .target-code { font-size: 12px; color: #95a5a6; margin-right: 8px; }
        .status-tag { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; white-space: nowrap; }
        .status-mastered { background: #d5f4e6; color: #27ae60; }
        .status-good { background: #dbeafe; color: #2563eb; }
        .status-need-practice { background: #ffedd5; color: #f97316; }
        .status-not-learned { background: #fdeaea; color: #e74c3c; }
        .status-weak { background: #fdeaea; color: #e74c3c; }
        
        .mastery-bar-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .mastery-bar { flex: 1; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; }
        .mastery-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }
        .mastery-text { font-size: 14px; font-weight: bold; color: #2c3e50; min-width: 50px; text-align: right; }
        
        .target-reason { font-size: 13px; color: #7f8c8d; margin-bottom: 14px; padding: 10px 14px; background: #f8f9fa; border-radius: 6px; border-left: 3px solid #3498db; line-height: 1.5; }
        .section-title { font-size: 14px; font-weight: bold; color: #2c3e50; margin: 14px 0 10px 0; padding-bottom: 6px; border-bottom: 2px solid #eef2f7; display: flex; align-items: center; gap: 8px; }
        .section-count { background: #3498db; color: white; border-radius: 12px; padding: 1px 8px; font-size: 12px; }
        
        .resource-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 10px; margin-bottom: 4px; }
        .resource-card { background: #f8f9fa; border-radius: 8px; padding: 14px; border: 1px solid #eee; display: flex; flex-direction: column; gap: 8px; }
        .resource-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .resource-title { font-size: 13px; font-weight: bold; color: #2c3e50; word-break: break-all; }
        .resource-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .r-tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
        .r-tag-video { background: #fdeaea; color: #e74c3c; }
        .r-tag-doc { background: #dbeafe; color: #2563eb; }
        .r-tag-ppt { background: #fef9e7; color: #f39c12; }
        .r-tag-relation { background: #e8f5e9; color: #2e7d32; }
        .r-tag-diff { background: #f3e5f5; color: #7b1fa2; }
        .r-tag-teacher { background: #fff3e0; color: #e65100; }
        .resource-reason { font-size: 12px; color: #7f8c8d; line-height: 1.5; }
        .btn { padding: 7px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; text-decoration: none; display: inline-block; font-weight: bold; text-align: center; }
        .btn-primary { background: #3498db; color: white; }
        .btn-primary:hover { background: #2980b9; }
        .btn-success { background: #27ae60; color: white; }
        .btn-success:hover { background: #229954; }
        .btn-outline { background: white; color: #3498db; border: 1px solid #3498db; }
        .btn-outline:hover { background: #ebf5fb; }
        
        .question-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 10px; }
        .question-card { background: #fafafa; border-radius: 8px; padding: 12px; border: 1px solid #e8e8e8; }
        .q-title { font-size: 13px; color: #2c3e50; margin-bottom: 8px; line-height: 1.5; }
        .q-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
        .q-tag { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
        .q-tag-diff { background: #f3e5f5; color: #7b1fa2; }
        .q-tag-kp { background: #dbeafe; color: #2563eb; }
        .q-tag-type { background: #e8f5e9; color: #2e7d32; }
        .q-tag-reason { background: #fef9e7; color: #f39c12; }
        .q-reason { font-size: 12px; color: #7f8c8d; margin-bottom: 8px; line-height: 1.4; }
        
        .learning-tip { font-size: 12px; color: #7f8c8d; margin-top: 10px; padding: 8px 12px; background: #fef9e7; border-radius: 6px; border-left: 3px solid #f39c12; line-height: 1.5; }
        .section-divider { height: 1px; background: #e8ecf0; margin: 16px 0; }
        .no-data { text-align: center; padding: 20px; color: #95a5a6; font-size: 13px; }
        
        .loading { text-align: center; padding: 40px; color: #95a5a6; font-size: 14px; }
        .error { text-align: center; padding: 40px; color: #e74c3c; font-size: 14px; }

        .score-info { font-size: 11px; color: #95a5a6; margin-top: 2px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <h3>学习推荐系统</h3>
        <div class="user-badge">{{ student_name }}</div>
    </div>
    
    <div class="nav-menu">
        <a href="/student/dashboard" class="nav-item">
            <i>&#128200;</i> 首页
        </a>
        <a href="/student/recommend_v2" class="nav-item">
            <i>&#127919;</i> 学习资源推荐
        </a>
        <a href="/student/resources" class="nav-item">
            <i>&#128218;</i> 学习资源库
        </a>
        <a href="/student/mastery" class="nav-item">
            <i>&#128202;</i> 知识点掌握度
        </a>
        <a href="/student/graph" class="nav-item">
            <i>&#128279;</i> 知识图谱
        </a>
        <a href="/student/discuss" class="nav-item">
            <i>&#128172;</i> 讨论区
        </a>
        <a href="/student/wrong-questions" class="nav-item">
            <i>&#128221;</i> 错题集
        </a>
        <a href="/student/records" class="nav-item">
            <i>&#128197;</i> 学习记录
        </a>
    </div>
    
    <div class="sidebar-footer">
        <button class="logout-btn" onclick="location.href='/logout'">退出登录</button>
    </div>
</div>

<div class="main-content">
    <div class="top-bar">
        <h2>学习资源推荐</h2>
        <button class="refresh" onclick="loadRecommendations()">刷新推荐</button>
    </div>
    
    <div class="content-area" id="contentArea">
        <div class="loading">正在加载推荐数据...</div>
    </div>
</div>

<script>
var container = document.getElementById('contentArea');

function loadRecommendations() {
    container.innerHTML = '<div class="loading">正在加载推荐数据...</div>';
    fetch('/student/recommend/data?t=' + Date.now() + '&refresh=1', {credentials: 'include'})
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (!data.success) {
                container.innerHTML = '<div class="error">加载失败: ' + esc(data.error || '未知错误') + '</div>';
                return;
            }
            renderPage(data);
        })
        .catch(function(e) {
            container.innerHTML = '<div class="error">网络错误: ' + esc(e.message) + '</div>';
        });
}

function renderPage(data) {
    var html = '';
    var s = data.student || {};
    var avgMastery = data.avg_mastery || 0;
    var avgPct = (avgMastery * 100).toFixed(1);
    var rtype = data.recommend_type || '';
    var typeClass = s.type === 'excellent' ? 'type-excellent' : (s.type === 'medium' ? 'type-medium' : 'type-weak');
    var typeLabel = s.type === 'excellent' ? '优秀' : (s.type === 'medium' ? '中等' : '入门/薄弱');
    var targets = data.targets || [];
    var weakCount = data.weak_count || 0;
    var basis = data.basis || '系统根据知识点掌握度、知识图谱关系、相似学生效果、资源偏好和错题记录生成推荐';
    
    var avgClass = avgMastery >= 0.70 ? 'high' : (avgMastery >= 0.40 ? 'medium' : 'low');
    
    html += '<div class="summary-card">';
    html += '<div class="summary-header">';
    html += '<div><span class="summary-title">' + esc(s.name || '') + '</span><span style="font-size:14px;color:#7f8c8d;margin-left:8px;">的学习资源推荐</span></div>';
    html += '<div class="recommend-type ' + typeClass + '">' + esc(rtype) + '</div>';
    html += '</div>';
    html += '<div class="recommend-basis"><strong>推荐依据：</strong>' + esc(basis) + '</div>';
    html += '<div class="summary-stats">';
    html += '<div class="stat-item"><div class="stat-value ' + avgClass + '">' + avgPct + '%</div><div class="stat-label">平均掌握度</div></div>';
    html += '<div class="stat-item"><div class="stat-value">' + esc(typeLabel) + '</div><div class="stat-label">学生类型</div></div>';
    html += '<div class="stat-item"><div class="stat-value">' + targets.length + '</div><div class="stat-label">推荐目标</div></div>';
    html += '<div class="stat-item"><div class="stat-value">' + weakCount + '</div><div class="stat-label">薄弱知识点</div></div>';
    html += '</div>';
    html += '</div>';
    
    if (targets.length === 0) {
        html += '<div class="no-data">暂无推荐内容，请先完成一些学习后刷新。</div>';
        container.innerHTML = html;
        return;
    }
    
    targets.forEach(function(target, idx) {
        var m = target.mastery || 0;
        var mPct = (m * 100).toFixed(1);
        var status = target.status || '未学习';
        var statusCls = 'status-not-learned';
        if (status === '已掌握') statusCls = 'status-mastered';
        else if (status === '中等' || status === '良好') statusCls = 'status-good';
        else if (status === '需巩固') statusCls = 'status-need-practice';
        else if (status === '薄弱') statusCls = 'status-weak';
        
        var barColor = m >= 0.80 ? '#27ae60' : (m >= 0.60 ? '#2563eb' : (m > 0 ? '#f97316' : '#cfd8dc'));
        
        var resources = target.resources || [];
        var questions = target.questions || [];
        
        html += '<div class="target-card">';
        html += '<div class="target-header">';
        html += '<div><span class="target-code">#' + (idx + 1) + ' ' + esc(target.code || target.knowledge_id || '') + '</span> <span class="target-title">' + esc(target.name || target.knowledge_name || '') + '</span></div>';
        html += '<span class="status-tag ' + statusCls + '">' + esc(status) + '</span>';
        html += '</div>';
        
        html += '<div class="mastery-bar-wrap">';
        html += '<div class="mastery-bar"><div class="mastery-fill" style="width:' + Math.max(mPct, 2) + '%;background:' + barColor + '"></div></div>';
        html += '<span class="mastery-text">' + mPct + '%</span>';
        html += '</div>';
        
        html += '<div class="target-reason"><strong>推荐原因：</strong>' + esc(target.reason || '根据掌握度分析推荐') + '</div>';
        
        if (resources.length > 0) {
            html += '<div class="section-title">推荐学习资源 <span class="section-count">' + resources.length + '</span></div>';
            html += '<div class="resource-grid">';
            resources.forEach(function(res) {
                var typeCls = 'r-tag-' + (res.type === '视频' ? 'video' : (res.type === 'PPT' ? 'ppt' : 'doc'));
                var openUrl = res.watch_url || res.view_url || '';
                if (!openUrl && res.file_name) {
                    openUrl = res.type === '视频' ? '/student/watch/' + encodeURIComponent(res.file_name) : '/student/view/' + encodeURIComponent(res.file_name);
                }
                
                html += '<div class="resource-card">';
                html += '<div class="resource-title" title="' + esc(res.title || '') + '">' + esc(res.title || res.file_name || '') + '</div>';
                html += '<div class="resource-meta">';
                html += '<span class="r-tag ' + typeCls + '">' + esc(res.type || '资源') + '</span>';
                html += '<span class="r-tag r-tag-relation">' + esc(res.relation_label || '当前知识点') + '</span>';
                html += '<span class="r-tag r-tag-diff">' + esc(res.difficulty || '中等') + '</span>';
                if (res.teacher) {
                    html += '<span class="r-tag r-tag-teacher">' + esc(res.teacher) + '</span>';
                }
                html += '</div>';
                html += '<div class="resource-reason">' + esc(res.reason || '') + '</div>';
                if (res.score !== undefined) {
                    html += '<div class="score-info">匹配度：' + (res.score * 100).toFixed(1) + '%</div>';
                }
                html += '<a href="' + openUrl + '" target="_blank" class="btn btn-primary">开始学习</a>';
                html += '</div>';
            });
            html += '</div>';
        } else {
            html += '<div class="section-title">推荐学习资源 <span class="section-count">0</span></div>';
            html += '<div class="no-data">暂无匹配学习资源，请先上传该知识点的教学资料</div>';
        }
        
        html += '<div class="section-divider"></div>';
        
        if (questions.length > 0) {
            html += '<div class="section-title">推荐练习题 <span class="section-count">' + questions.length + '</span></div>';
            html += '<div class="question-grid">';
            questions.forEach(function(q) {
                var practiceUrl = q.practice_url || ('/student/recommend/practice/' + encodeURIComponent(q.question_id));
                var qtype = q.type || 'single_choice';
                var qtypeLabel = qtype === 'multiple_choice' ? '多选' : (qtype === 'blank' ? '填空' : '单选');
                
                html += '<div class="question-card">';
                html += '<div class="q-title">' + esc((q.title || q.question || '').substring(0, 80)) + '</div>';
                html += '<div class="q-meta">';
                html += '<span class="q-tag q-tag-type">' + qtypeLabel + '</span>';
                html += '<span class="q-tag q-tag-diff">' + esc(q.difficulty || '基础') + '</span>';
                if (q.knowledge_name) {
                    html += '<span class="q-tag q-tag-kp">' + esc(q.knowledge_name) + '</span>';
                }
                html += '</div>';
                html += '<div class="q-reason">' + esc(q.reason || '推荐练习') + '</div>';
                html += '<a href="' + practiceUrl + '" target="_blank" class="btn btn-success">开始练习</a>';
                html += '</div>';
            });
            html += '</div>';
        } else {
            html += '<div class="section-title">推荐练习题 <span class="section-count">0</span></div>';
            html += '<div class="no-data">暂无匹配练习题</div>';
        }
        
        if (m >= 0.80) {
            html += '<div class="learning-tip"><strong>学习建议：</strong>该知识点已较好掌握，可挑战更高难度的综合题目或学习后续进阶内容。</div>';
        } else if (m >= 0.60) {
            html += '<div class="learning-tip"><strong>学习建议：</strong>基础较好，建议通过中等难度练习进一步提升，查漏补缺。</div>';
        } else if (m > 0) {
            html += '<div class="learning-tip"><strong>学习建议：</strong>掌握度偏低，建议认真学习推荐资源后完成练习题，优先巩固薄弱环节。</div>';
        } else {
            html += '<div class="learning-tip"><strong>学习建议：</strong>该知识点尚未学习，建议先观看视频/文档资源了解基础概念，然后完成基础练习题。</div>';
        }
        
        html += '</div>';
    });
    
    container.innerHTML = html;
}

function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

loadRecommendations();
</script>
</body>
</html>
