<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>知识图谱 - 四级节点可视化</title>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/standalone/umd/vis-network.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', 'SimHei', Arial, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

.topbar {
    background: #16213e; padding: 10px 24px; display: flex;
    align-items: center; justify-content: space-between; gap: 16px;
    border-bottom: 1px solid #0f3460; flex-shrink: 0;
}
.topbar h1 { font-size: 20px; font-weight: normal; color: #e94560; white-space: nowrap; }
.topbar .controls { display: flex; align-items: center; gap: 10px; }
.topbar input {
    padding: 8px 14px; border: 1px solid #0f3460; border-radius: 4px;
    background: #1a1a2e; color: #eee; font-size: 14px; width: 280px; outline: none;
}
.topbar input:focus { border-color: #e94560; }
.topbar button {
    padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer;
    font-size: 14px; background: #e94560; color: white;
}
.topbar button:hover { background: #c73652; }
.topbar .stat { font-size: 13px; color: #8899aa; white-space: nowrap; }

.legend-bar {
    background: #16213e; padding: 8px 24px; display: flex;
    gap: 24px; align-items: center; flex-wrap: wrap;
    border-bottom: 1px solid #0f3460; flex-shrink: 0; font-size: 12px;
}
.legend-group { display: flex; align-items: center; gap: 6px; }
.legend-shape {
    width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
    border: 2px solid #555;
}
.legend-shape.diamond { background: #555; transform: rotate(45deg); width: 14px; height: 14px; border-radius: 2px; }
.legend-shape.hexagon { background: #555; clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); width: 18px; height: 18px; }
.legend-shape.triangle { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 16px solid #555; border-top: none; background: none; }
.legend-shape.dot { background: #555; border-radius: 50%; width: 10px; height: 10px; }
.legend-color { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #666; }
.legend-divider { color: #333; }

#container {
    flex: 1; position: relative; min-height: 0;
}
#network {
    width: 100%; height: 100%; background: #1a1a2e;
}
#loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 18px; color: #8899aa; display: none;
}
#loading.show { display: block; }
#loading .spinner {
    display: inline-block; width: 28px; height: 28px; border: 3px solid #333;
    border-top-color: #e94560; border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.tooltip {
    position: absolute; display: none; background: #16213e; border: 1px solid #0f3460;
    padding: 14px 18px; border-radius: 6px; font-size: 13px; z-index: 100;
    pointer-events: none; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}
.tooltip .name { font-size: 15px; font-weight: bold; color: #eee; margin-bottom: 6px; }
.tooltip .info { color: #8899aa; line-height: 1.8; }
.tooltip .mastery-bar { height: 6px; background: #333; border-radius: 3px; margin-top: 6px; overflow: hidden; }
.tooltip .mastery-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
</style>
</head>
<body>

<div class="topbar">
    <h1>知识图谱</h1>
    <div class="controls">
        <input type="text" id="sidInput" placeholder="输入学生ID，例如 3220602001 或留空看全图" value="">
        <button onclick="loadGraph()">查 询</button>
    </div>
    <div class="stat" id="stat">就绪</div>
</div>

<div class="legend-bar">
    <span style="color:#8899aa;">节点形状 = 层级：</span>
    <div class="legend-group"><div class="legend-shape diamond"></div> 课程根节点</div>
    <div class="legend-group"><div class="legend-shape hexagon"></div> 章</div>
    <div class="legend-group"><div class="legend-shape triangle"></div> 节</div>
    <div class="legend-group"><div class="legend-shape dot"></div> 知识点</div>
    <span class="legend-divider">|</span>
    <span style="color:#8899aa;">颜色 = 学习状态：</span>
    <div class="legend-group"><div class="legend-color" style="background:#27ae60;"></div> 已掌握(≥80%)</div>
    <div class="legend-group"><div class="legend-color" style="background:#3498db;"></div> 良好(≥60%)</div>
    <div class="legend-group"><div class="legend-color" style="background:#f39c12;"></div> 进行中(≥40%)</div>
    <div class="legend-group"><div class="legend-color" style="background:#e74c3c;"></div> 薄弱(&lt;40%)</div>
    <div class="legend-group"><div class="legend-color" style="background:#7f8c8d;"></div> 未学习</div>
    <span class="legend-divider">|</span>
    <span style="color:#8899aa;">边：</span>
    <span style="color:#95a5a6;">━━ 包含</span>
    <span style="color:#f39c12;">╌╌ 相关</span>
    <span style="color:#9b59b6;">╌╌ 先修</span>
</div>

<div id="container">
    <div id="network"></div>
    <div id="loading" class="show">
        <span class="spinner"></span>加载中...
    </div>
    <div class="tooltip" id="tooltip">
        <div class="name" id="tipName"></div>
        <div class="info" id="tipInfo"></div>
        <div class="mastery-bar"><div class="mastery-fill" id="tipBar"></div></div>
    </div>
</div>

<script>
var network = null;
var currentData = null;

var levelShape = { '-1': 'diamond', '0': 'hexagon', '1': 'triangle', '2': 'dot' };
var levelSize  = { '-1': 72,        '0': 50,       '1': 42,      '2': 28 };
var levelLabel = { '-1': '课程',    '0': '章',     '1': '节',   '2': '知识点' };

function masteryColor(m) {
    if (m >= 0.8) return { background: '#27ae60', border: '#1e8449' };
    if (m >= 0.6) return { background: '#3498db', border: '#2471a3' };
    if (m >= 0.4) return { background: '#f39c12', border: '#d68910' };
    if (m > 0)    return { background: '#e74c3c', border: '#b03a2e' };
    return { background: '#7f8c8d', border: '#5d6d7e' };
}

function masteryLabel(m) {
    if (m >= 0.8) return '已掌握';
    if (m >= 0.6) return '良好';
    if (m >= 0.4) return '进行中';
    if (m > 0)    return '薄弱';
    return '未学习';
}

var edgeStyle = {
    '包含': { color: { color: '#95a5a6', highlight: '#bdc3c7' }, dashes: false, width: 2 },
    '相关': { color: { color: '#f39c12', highlight: '#f1c40f' }, dashes: true, width: 2 },
    '先修': { color: { color: '#9b59b6', highlight: '#af7ac5' }, dashes: true, width: 3 }
};

var options = {
    physics: {
        enabled: true,
        solver: 'forceAtlas2Based',
        forceAtlas2Based: {
            gravitationalConstant: -180,
            centralGravity: 0.008,
            springLength: 200,
            springConstant: 0.06,
            damping: 0.4,
            avoidOverlap: 1.5
        },
        maxVelocity: 4,
        minVelocity: 0.02,
        adaptiveTimestep: true,
        timestep: 0.3,
        stabilization: {
            enabled: true,
            iterations: 1500,
            fit: true,
            onlyDynamicEdges: false,
            updateInterval: 50
        }
    },
    layout: { hierarchical: { enabled: false }, improvedLayout: false },
    interaction: {
        hover: true, tooltipDelay: 150,
        zoomView: true, dragView: true, dragNodes: true,
        navigationButtons: false, keyboard: { enabled: false }
    },
    nodes: {
        shape: 'dot',
        scaling: { enabled: false },
        font: { size: 10, color: '#ccc', face: 'Microsoft YaHei', align: 'center' }
    },
    edges: {
        smooth: { type: 'continuous', roundness: 0.2 },
        arrows: { to: { enabled: true, scaleFactor: 0.6 } }
    }
};

function loadGraph() {
    var sid = document.getElementById('sidInput').value.trim();
    var url = '/api/knowledge_graph';
    if (sid) url += '?student_id=' + encodeURIComponent(sid);

    document.getElementById('loading').classList.add('show');
    document.getElementById('stat').textContent = '加载中...';
    if (network) { network.destroy(); network = null; }

    fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
            document.getElementById('loading').classList.remove('show');
            currentData = data;

            var nCount = data.nodes.length;
            var eCount = data.edges.length;
            var chCount = data.nodes.filter(function(n) { return n.level === 0; }).length;
            var kpCount = data.nodes.filter(function(n) { return n.level === 2; }).length;
            document.getElementById('stat').textContent =
                chCount + '章 | ' + kpCount + '个知识点 | ' + nCount + '节点 | ' + eCount + '边';

            var nodesArr = data.nodes.map(function(n) {
                var lvl = String(n.level);
                var shape = levelShape[lvl] || 'dot';
                var size = levelSize[lvl] || 15;
                var color = masteryColor(n.mastery);

                return {
                    id: n.id,
                    label: n.label,
                    group: n.group,
                    level: n.level,
                    mastery: n.mastery,
                    shape: shape,
                    size: size,
                    color: color,
                    font: { size: n.level <= 1 ? 12 : 9, color: '#ccc', face: 'Microsoft YaHei', align: 'center' },
                    borderWidth: shape === 'dot' ? 3 : 2,
                    borderWidthSelected: 3
                };
            });

            var nodes = new vis.DataSet(nodesArr);
            var edges = new vis.DataSet(data.edges.map(function(e, i) {
                var es = edgeStyle[e.type] || edgeStyle['包含'];
                return {
                    id: i,
                    from: e.from, to: e.to,
                    arrows: 'to',
                    color: es.color,
                    dashes: es.dashes,
                    width: es.width,
                    smooth: { type: 'continuous', roundness: 0.15 }
                };
            }));

            var container = document.getElementById('network');
            var graphData = { nodes: nodes, edges: edges };
            network = new vis.Network(container, graphData, options);

            var tooltip = document.getElementById('tooltip');
            var tipName = document.getElementById('tipName');
            var tipInfo = document.getElementById('tipInfo');
            var tipBar = document.getElementById('tipBar');

            network.on('hoverNode', function(params) {
                var nid = params.node;
                var node = nodesArr.find(function(n) { return n.id === nid; });
                if (!node) { tooltip.style.display = 'none'; return; }

                var lvlStr = levelLabel[String(node.level)] || '未知';
                var state = masteryLabel(node.mastery);
                var pct = Math.round(node.mastery * 100);

                tipName.textContent = node.label || node.id;
                tipInfo.innerHTML =
                    '层级：<b>' + lvlStr + '</b>（第' + (node.level + 2) + '级）<br>' +
                    '掌握度：<b>' + pct + '%</b>（' + state + '）<br>' +
                    '节点ID：' + node.id;
                tipBar.style.width = pct + '%';

                if (node.mastery >= 0.8) tipBar.style.background = '#27ae60';
                else if (node.mastery >= 0.6) tipBar.style.background = '#3498db';
                else if (node.mastery >= 0.4) tipBar.style.background = '#f39c12';
                else if (node.mastery > 0) tipBar.style.background = '#e74c3c';
                else tipBar.style.background = '#7f8c8d';

                var pos = network.canvasToDOM({ x: params.event.center.x, y: params.event.center.y });
                tooltip.style.left = (pos.x + 20) + 'px';
                tooltip.style.top  = (pos.y - 10) + 'px';
                tooltip.style.display = 'block';
            });

            network.on('blurNode', function() {
                tooltip.style.display = 'none';
            });

            network.on('click', function(params) {
                if (params.nodes.length > 0) {
                    network.focus(params.nodes[0], {
                        scale: 1.5,
                        animation: { duration: 600, easingFunction: 'easeInOutQuad' }
                    });
                }
            });

            network.on('stabilizationIterationsDone', function() {
                network.setOptions({ physics: { enabled: true } });
            });
        })
        .catch(function(err) {
            document.getElementById('loading').classList.remove('show');
            document.getElementById('stat').textContent = '加载失败: ' + err.message;
        });
}

window.onload = function() { loadGraph(); };
</script>
</body>
</html>
