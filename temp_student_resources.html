var PAGE="resources",app=document.getElementById('app'),TARGET=new URLSearchParams(location.search).get('target_kp')||'',ALL_POSTS=[],COMMENTS=[],KP_OPTIONS=[];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

async function getJson(u){try{var r=await fetch(u);return await r.json()}catch(e){return {success:false,learning_path:[],resources:[],chapters:[],records:[],groups:[],posts:[],comments:[],nodes:[],edges:[],stats:{}}}}

async function dashboard(){var d=await getJson('/student/dashboard/data'),st=d.stats||{},total=(st.mastered||0)+(st.good||0)+(st.weak||0)+(st.unlearned||0),p=d.profile||{},avgMastery=p.avg_mastery||0,rg=d.recent_groups||[],rm=d.recommendations||[],w3=(d.weak_points||[]).slice(0,3),today=d.today_count||0;app.innerHTML='<div class="dash"><div class="hero hero-overview"><h2>今日学习概览</h2><div class="grid" style="margin-top:12px"><div class="stat"><span>综合掌握度</span><b>'+pct(avgMastery)+'</b><span class="muted">'+esc(p.level||'')+'</span></div><div class="stat"><span>今日学习</span><b>'+today+'</b><span class="muted">条学习记录</span></div><div class="stat"><span>做题总数</span><b>'+(p.total_questions||0)+'</b><span class="muted">正确率 '+pct(p.accuracy||0)+'</span></div><div class="stat"><span>错题待练</span><b>'+(p.wrong_count||0)+'</b><span class="muted">去错题集复练</span></div></div></div><div class="hero light hero-profile"><h2>学习画像</h2><div class="pill-row" style="margin-top:4px"><span class="tag ok">已掌握 '+(st.mastered||0)+'</span><span class="tag">良好 '+(st.good||0)+'</span><span class="tag warn">需巩固 '+(st.weak||0)+'</span><span class="tag bad">未学习 '+(st.unlearned||0)+'</span></div>'+bar(avgMastery,p.level||'')+'<p class="muted" style="margin-top:8px">知识点总数 '+total+'，已掌握+'+(st.mastered||0)+'+良好+'+(st.good||0)+'+需巩固+'+(st.weak||0)+'+未学习+'+(st.unlearned||0)+'='+total+'</p></div></div><div class="grid"><a class="stat" href="/student/recommend"><span>学习资源推荐</span><b>查看推荐</b><span class="muted">'+rm.length+' 个推荐资源</span></a><a class="stat" href="/student/resources"><span>学习资源库</span><b>开始学习</b><span class="muted">视频 / 文档 / 习题</span></a><a class="stat" href="/student/graph"><span>知识图谱</span><b>查看图谱</b><span class="muted">单击节点查看掌握度</span></a><a class="stat" href="/student/mastery"><span>知识点掌握度</span><b>'+pct(avgMastery||0)+'</b><span class="muted">'+total+' 个知识点</span></a></div><div class="split" style="display:grid;grid-template-columns:1.2fr .8fr;gap:16px"><div><div class="card"><h2>最近学习记录</h2>'+(rg.length?rg.map(function(g){return '<details class="chapter" open><summary>'+esc(g.date)+' · '+g.items.length+' 条</summary>'+g.items.map(function(r){return '<div class="record-card"><span class="tag">'+esc(typeText(r.type))+'</span><div><b>'+esc(r.name)+'</b><div class="muted">'+esc(r.knowledge_point||'')+'</div></div><div class="muted">'+esc(r.time||'')+'</div></div>'}).join('')+'</details>'}).join(''):'<div class="empty">暂无学习记录</div>')+'</div><div class="card"><h2>学习建议</h2>'+((p.suggestions||[]).map(function(x){return '<div class="hint">'+esc(x)+'</div>'}).join('')||'<div class="empty">暂无建议</div>')+'</div></div><div><div class="card"><h2>今日推荐摘要</h2>'+(rm.slice(0,3).map(function(r){return '<div class="res-card"><b>'+esc(r.title||r.name)+'</b><p><span class="tag">'+esc(typeText(r.type))+'</span><span class="tag">'+esc(r.difficulty||'中等')+'</span></p><p class="muted">'+esc(r.knowledge_point||'')+'</p><a class="btn light" href="'+action(r)+'">查看</a></div>'}).join('')||'<div class="empty">暂无推荐</div>')+'</div><div class="card"><h2>薄弱知识点 Top3</h2>'+(w3.length?w3.map(function(x){return '<div class="row"><div><b>'+esc(x.name)+'</b></div><div><b>'+pct(x.score)+'</b></div></div>'}).join(''):'<div class="empty">暂无薄弱知识点</div>')+'</div><div class="card"><h2>最近学习摘要</h2>'+(rg.slice(0,3).map(function(g){return '<div class="record-card"><span class="tag">'+esc(g.date)+'</span><div><b>'+esc(((g.items||[])[0]||{}).name||'无')+'</b><div class="muted">共 '+g.items.length+' 条</div></div></div>'}).join('')||'<div class="empty">暂无</div>')+'</div></div></div>'}
async function pathPage(){var d=await getJson('/student/path/data'+(TARGET?'?target_kp='+encodeURIComponent(TARGET):'')),steps=d.learning_path||[];app.innerHTML='<div class="card"><h2>学习资源推荐</h2><p class="muted">目标：'+esc(displayKp(d.target_kp||''))+'。路径按掌握度、章节关联和资源匹配度排序。</p></div><div class="card">'+(steps.map(function(st,i){return '<div class="path-step"><div class="no">'+(i+1)+'</div><div><b>'+esc(displayKp(st.name))+'</b><p><span class="tag '+statusClass(st.status)+'">'+esc(st.status)+'</span> <span class="tag">掌握度 '+pct(st.score)+'</span></p>'+bar(st.score,st.status)+'<p class="muted">'+esc(st.reason||'建议优先巩固该知识点')+'</p><div class="res-list">'+(st.resources||[]).map(function(r){return '<div class="res-card"><b>'+esc(r.title||r.name)+'</b><p><span class="tag">'+esc(typeText(r.type))+'</span> <span class="tag">'+esc(r.difficulty||'中等')+'</span></p><a class="btn light" href="'+action(r)+'">学习</a></div>'}).join('')+'</div></div></div>'}).join('')||'<div class="empty">暂无路径数据</div>')+'</div>'}
async function resourcesPage(){var d=await getJson('/student/resources/data'),all=d.resources||[],types=[...new Set(all.map(function(r){return typeText(r.type)}))];app.innerHTML='<div class="card"><h2>学习资源库</h2><div class="toolbar"><input class="search" id="resQ" placeholder="搜索资源、知识点、章节" oninput="renderResources()"><select id="resType" onchange="renderResources()"><option>全部类型</option>'+types.map(function(t){return '<option>'+esc(t)+'</option>'}).join('')+'</select></div></div><div id="resResults"></div>';window.renderResources=function(){var q=(resQ.value||'').toLowerCase(),selected=resType.value,list=all.filter(function(r){return (selected==='全部类型'||typeText(r.type)===selected)&&[r.name,r.title,r.knowledge_point,r.chapter_label,r.section_label,typeText(r.type)].join(' ').toLowerCase().indexOf(q)>=0}),groups={};list.forEach(function(r){var ch=r.chapter_label||'未分类',sec=r.section_label||'未分类';groups[ch]=groups[ch]||{};groups[ch][sec]=groups[ch][sec]||[];groups[ch][sec].push(r)});resResults.innerHTML=Object.keys(groups).sort((a,b)=>a.localeCompare(b,'zh-Hans',{numeric:true})).map(function(ch,i){var secs=Object.keys(groups[ch]).sort((a,b)=>a.localeCompare(b,'zh-Hans',{numeric:true}));return '<details class="chapter" '+(i===0?'open':'')+'><summary>'+esc(ch)+' · '+secs.reduce((n,s)=>n+groups[ch][s].length,0)+' 个资源</summary>'+secs.map(function(sec){return '<details class="section" open><summary>'+esc(sec)+' · '+groups[ch][sec].length+'</summary><div class="res-grid" style="padding:12px">'+groups[ch][sec].map(function(r){return '<div class="res-card"><b>'+esc(r.title||r.name)+'</b><p><span class="tag">'+esc(typeText(r.type))+'</span> <span class="tag">'+esc(r.difficulty||'中等')+'</span></p><p class="muted">对应知识点：'+esc(r.knowledge_point||'')+'</p><a class="btn light" href="'+action(r)+'">在线查看</a></div>'}).join('')+'</div></details>'}).join('')+'</details>'}).join('')||'<div class="empty">暂无资源</div>'};renderResources()}
async function mastery(){var d=await getJson('/student/mastery/data'),chs=d.chapters||[];app.innerHTML='<div class="card"><h2>知识点掌握度</h2>'+(chs.map(function(ch){var points=ch.knowledge_points||[],secs={};points.forEach(function(k){var code=codeOf(k.code||k.kp_id||k.name),sec=code.split('.').slice(0,2).join('.')||'未分节';secs[sec]=secs[sec]||[];secs[sec].push(k)});return '<details class="chapter" open><summary>'+esc(ch.title)+' · '+points.length+' 个知识点</summary>'+Object.keys(secs).sort((a,b)=>a.localeCompare(b,'zh-Hans',{numeric:true})).map(function(sec){return '<details class="section" open><summary>'+esc(sec)+' · '+secs[sec].length+'</summary>'+secs[sec].map(function(k){return '<div class="kp-row"><div><b>'+esc(displayKp(k.full_name||k.name))+'</b><div class="muted">'+esc(k.status)+' · '+(k.correct_questions||0)+'/'+(k.total_questions||0)+' 题</div></div><b>'+pct(k.score)+'</b>'+bar(k.score,k.status)+'</div>'}).join('')+'</details>'}).join('')+'</details>'}).join('')||'<div class="empty">暂无掌握度数据</div>')+'</div>'}
function wrapLabel(text,max){text=String(text||'');var code=codeOf(text),name=kpName(text),chars=name.split(''),lines=[],line='';chars.forEach(function(c){line+=c;if(line.length>=max){lines.push(line);line=''}});if(line)lines.push(line);return (code?code+'\n':'')+lines.join('\n')}
function graphCode(n){return codeOf((n&&n.label)||'')||codeOf((n&&n.id)||'')}
function graphSort(a,b){return String(a.label||a.id).localeCompare(String(b.label||b.id),'zh-Hans',{numeric:true})}
function graphPosition(nodes){
  var root=nodes.find(function(n){return n.level<0||n.shape==='diamond'})||nodes[0];
  if(root){root.x=0;root.y=0;root.fixed={x:true,y:true}}
  var chapters=nodes.filter(function(n){return n!==root&&(n.level===0||n.shape==='hexagon')}).sort(graphSort);
  var sections=nodes.filter(function(n){var c=graphCode(n).split('.');return n.level===1||c.length===2}).sort(graphSort);
  var leaves=nodes.filter(function(n){var c=graphCode(n).split('.');return n!==root&&chapters.indexOf(n)<0&&sections.indexOf(n)<0&&(n.level>=2||c.length>=3)}).sort(graphSort);
  var chapterAngles={};
  chapters.forEach(function(n,i){var a=-Math.PI/2+Math.PI*2*i/Math.max(1,chapters.length);chapterAngles[graphCode(n)]=a;n.x=Math.cos(a)*230;n.y=Math.sin(a)*190;n.fixed={x:true,y:true}});
  var secByChapter={};sections.forEach(function(n){var ch=graphCode(n).split('.')[0]||'0';(secByChapter[ch]||(secByChapter[ch]=[])).push(n)});
  Object.keys(secByChapter).forEach(function(ch){var arr=secByChapter[ch].sort(graphSort),base=chapterAngles[ch];if(base==null)base=-Math.PI/2;var span=Math.min(1.15,.38+.16*arr.length);arr.forEach(function(n,i){var a=base-span/2+span*(i+.5)/Math.max(1,arr.length);n._angle=a;n.x=Math.cos(a)*420;n.y=Math.sin(a)*340;n.fixed={x:true,y:true}})});
  var leafBySection={};leaves.forEach(function(n){var p=graphCode(n).split('.').slice(0,2).join('.')||'0';(leafBySection[p]||(leafBySection[p]=[])).push(n)});
  Object.keys(leafBySection).forEach(function(sec){var parent=sections.find(function(s){return graphCode(s)===sec}),base=parent&&parent._angle;if(base==null)base=chapterAngles[sec.split('.')[0]]||-Math.PI/2;var arr=leafBySection[sec].sort(graphSort),span=Math.min(.58,.20+.075*arr.length);arr.forEach(function(n,i){var a=base-span/2+span*(i+.5)/Math.max(1,arr.length);n.x=Math.cos(a)*660;n.y=Math.sin(a)*545;n.fixed={x:true,y:true}})});
}
async function graphPage(){var d=await getJson('/student/flow-graph/data'),nodes=d.nodes||[],edges=d.edges||[];graphPosition(nodes);app.innerHTML='<div class="card"><h2>知识图谱</h2><div class="muted"><b>形状：</b>菱形课程 > 六边形章 > 正方形大节 > 圆形知识点　<b>颜色：</b><span class="tag ok">已掌握</span><span class="tag">良好</span><span class="tag warn">需巩固</span><span class="tag bad">未学习</span><b style="margin-left:12px">边：</b>包含（实线）/ 相关（虚线）/ 先修（虚线）</div><div style="display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;margin-top:14px"><div style="position:relative"><div id="mynetwork" style="height:760px;border:1px solid #e5e7eb;background:#fafafa"></div><div style="position:absolute;right:18px;top:18px;width:62px;background:#fff;border:1px solid #dbe3ef;border-radius:14px;box-shadow:0 8px 24px rgba(15,23,42,.12);padding:10px;display:grid;gap:6px;place-items:center"><button class="btn light" style="width:40px;height:40px;padding:0" onclick="zoomGraph(.06)">+</button><input id="graphZoom" type="range" min="0" max="100" value="38" oninput="setGraphZoom(this.value)" style="writing-mode:vertical-lr;direction:rtl;-webkit-appearance:slider-vertical;width:40px;height:250px"><button class="btn light" style="width:40px;height:40px;padding:0" onclick="zoomGraph(-.06)">-</button></div></div><div id="nodeDetail" class="res-card graph-detail"><b>节点详情</b><p class="muted">单击节点查看掌握度。</p></div></div></div>';if(!window.vis){mynetwork.innerHTML='<div class="empty">vis 加载失败</div>';return}function color(m){return m>=.8?{background:'#d4f0dc',border:'#8fd3a6'}:m>=.6?{background:'#dbeafe',border:'#93c5fd'}:m>0?{background:'#ffedd5',border:'#fdba74'}:{background:'#eceff1',border:'#cfd8dc'}}var visNodes=new vis.DataSet(nodes.map(function(n){var isRoot=n.shape==='diamond';return {id:n.id,label:wrapLabel(n.label,isRoot?4:(n.shape==='hexagon'?4:(n.shape==='square'?5:4))),shape:n.shape||'circle',size:n.size||40,x:n.x,y:n.y,fixed:{x:true,y:true},color:isRoot?{background:'#0f172a',border:'#020617'}:color(n.mastery||0),font:{size:n.fontSize||16,face:'Microsoft YaHei',color:isRoot?'#fff':'#0f172a',bold:true,multi:true,align:'center',vadjust:0},borderWidth:isRoot?5:3,widthConstraint:n.shape==='square'?{minimum:88,maximum:120}:undefined,heightConstraint:n.shape==='square'?{minimum:58}:undefined}}));var visEdges=new vis.DataSet(edges.map(function(e,i){return {id:i,from:e.from,to:e.to,arrows:'to',color:{color:e.type==='先修'?'#9b59b6':(e.type==='相关'?'#f59e0b':'#94a3b8')},dashes:e.type!=='包含',width:e.type==='包含'?2.2:1.5,smooth:e.type==='包含'?{type:'continuous'}:{type:'curvedCW',roundness:.15}}}));var network=new vis.Network(mynetwork,{nodes:visNodes,edges:visEdges},{physics:false,interaction:{zoomView:true,dragView:true,dragNodes:false},layout:{improvedLayout:false}});window.graphNetwork=network;window.graphScale=.48;setTimeout(function(){network.fit({animation:{duration:160,easingFunction:'easeInOutQuad'}});applyGraphZoom(.48,true)},80);network.on('click',function(p){var id=p.nodes&&p.nodes[0],n=nodes.find(function(x){return x.id===id});if(!n)return;var s=(n.mastery||0)>=.8?'已掌握':((n.mastery||0)>=.6?'良好':((n.mastery||0)>0?'需巩固':'未学习'));nodeDetail.innerHTML='<b>'+esc(displayKp(n.label))+'</b><p><span class="tag '+statusClass(s)+'">'+s+'</span> <span class="tag">掌握度 '+pct(n.mastery||0)+'</span></p>'+bar(n.mastery||0,s)+'<p class="muted">'+esc(n.levelName||'')+' · '+(n.correct_questions||0)+'/'+(n.total_questions||0)+' 题</p>'})}
function graphSliderToScale(v){return .38+(Math.max(0,Math.min(100,parseFloat(v)||0))/100)*.9}function applyGraphZoom(s,a){window.graphScale=Math.max(.38,Math.min(1.28,parseFloat(s)||.42));if(window.graphNetwork)window.graphNetwork.moveTo({position:{x:0,y:0},scale:window.graphScale,animation:a?{duration:120,easingFunction:'easeInOutQuad'}:{duration:0}});if(window.graphZoom)graphZoom.value=Math.round((window.graphScale-.38)/.9*100)}function setGraphZoom(v){applyGraphZoom(graphSliderToScale(v),false)}function zoomGraph(d){applyGraphZoom((window.graphScale||.42)+d,true)}
async function discuss(){await loadKps();var d=await getJson('/student/discuss/list');ALL_POSTS=d.posts||[];var c=await getJson('/student/discuss/my-comments');COMMENTS=c.comments||[];app.innerHTML='<div class="card"><h2>发布问题</h2><div class="toolbar"><input id="topicTitle" class="search" placeholder="问题标题"><input id="topicTag" class="search" list="kpList" placeholder="先搜索/选择知识点标签"><datalist id="kpList">'+KP_OPTIONS.map(k=>'<option value="'+esc(k)+'"></option>').join('')+'</datalist><button class="btn" onclick="postTopic()">发布</button></div><textarea id="topicBody" style="width:100%" rows="3" placeholder="描述你的问题、卡点或学习经验"></textarea></div><div class="forum"><div class="card forum-list"><h2>问题列表</h2><div class="toolbar"><input id="discussQ" class="search" placeholder="搜索编号、标题、内容、作者、知识点" oninput="renderDiscuss()"><button class="btn light" onclick="setDiscussMode(&quot;all&quot;)">全部问题</button><button class="btn light" onclick="setDiscussMode(&quot;mine&quot;)">我的问题</button><button class="btn light" onclick="setDiscussMode(&quot;comments&quot;)">我的评论</button></div><div id="discussList"></div></div><div class="card" id="postDetail"><h2>问题详情</h2><p class="muted">点击左侧问题查看详情和回复。</p></div></div>';window.DISC_MODE='all';renderDiscuss()}

function renderDiscuss(){var q=(discussQ&&discussQ.value||'').toLowerCase();if(window.DISC_MODE==='comments'){discussList.innerHTML=COMMENTS.filter(c=>!q||[c.no,c.title,c.body].join(' ').toLowerCase().includes(q)).map(c=>'<div class="post" onclick="openPost(&quot;'+esc(c.post_id)+'&quot;)"><b>#'+esc(c.no)+' '+esc(c.title)+'</b><p>'+esc(c.body)+'</p><div class="muted">'+esc(c.time)+'</div></div>').join('')||'<div class="empty">暂无我的评论</div>';return}var list=ALL_POSTS.filter(function(p){var ok=window.DISC_MODE!=='mine'||p.is_mine,hit=!q||[p.no,p.title,p.body,p.author,p.knowledge_tag,p.status].join(' ').toLowerCase().includes(q);return ok&&hit});discussList.innerHTML=list.map(function(p){return '<div class="post" onclick="openPost(&quot;'+esc(p.id)+'&quot;)"><div class="post-head"><b>#'+esc(p.no)+' '+esc(p.title)+'</b><span class="tag '+(p.status==='已解决'?'ok':'warn')+'">'+esc(p.status)+'</span></div><div class="muted">'+esc(p.author)+' · '+esc(p.time)+' · '+esc(displayKp(p.knowledge_tag)||'未标注')+' · '+(p.comment_count||0)+' 条回复</div><p>'+esc(p.body||'')+'</p></div>'}).join('')||'<div class="empty">暂无讨论</div>'}
async function postTopic(){if(!topicTitle.value.trim())return alert('请填写标题');if(!topicTag.value.trim())return alert('请先选择知识点标签');if(!topicBody.value.trim())return alert('请填写问题内容');let d=await fetch('/student/discuss/post',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:topicTitle.value.trim(),body:topicBody.value.trim(),knowledge_tag:topicTag.value.trim()})}).then(r=>r.json());alert(d.success?'发布成功，问题编号 #'+d.no:(d.error||'发布失败'));if(d.success)discuss()}
async function openPost(id){let d=await getJson('/student/discuss/detail/'+encodeURIComponent(id)),p=d.post||{};postDetail.innerHTML='<div class="post-head"><h2>#'+esc(p.no)+' '+esc(p.title)+'</h2><span class="tag '+(p.status==='已解决'?'ok':'warn')+'">'+esc(p.status)+'</span></div><p>'+esc(p.body||'')+'</p><div class="muted">'+esc(p.author||'')+' · '+esc(p.time||'')+' · '+esc(displayKp(p.knowledge_tag)||'未标注')+'</div>'+(p.is_mine?'<div class="toolbar"><button class="btn light" onclick="setStatus(&quot;'+esc(id)+'&quot;,&quot;已解决&quot;)">标为已解决</button><button class="btn light" onclick="setStatus(&quot;'+esc(id)+'&quot;,&quot;未解决&quot;)">标为未解决</button><button class="btn danger" onclick="deleteTopic(&quot;'+esc(id)+'&quot;)">删除问题</button></div>':'')+'<h3>回复</h3>'+((p.comments||[]).map(function(c){return '<div class="comment"><div class="comment-tools"><b>'+c.floor+'楼 · '+esc(c.author)+'</b><span>'+(c.is_mine?'<button class="btn light" onclick="deleteComment(&quot;'+esc(c.id)+'&quot;,&quot;'+esc(id)+'&quot;)">删除</button>':'')+' <button class="btn light" onclick="replyTo(&quot;'+esc(c.author)+'&quot;)">回复</button></span></div><p>'+esc(c.body)+'</p><div class="muted">'+esc(c.time)+'</div></div>'}).join('')||'<div class="muted">暂无回复</div>')+'<textarea id="commentBody" style="width:100%" rows="3" placeholder="写下回复"></textarea><button class="btn" onclick="commentPost(&quot;'+esc(id)+'&quot;)">提交回复</button>'}
function replyTo(name){commentBody.value='回复'+name+'：';commentBody.focus()}

async function commentPost(id){let body=commentBody.value.trim();if(!body)return alert('请填写回复');let m=body.match(/^回复([^：:]+)[：:]/),reply=m?m[1]:'';let d=await fetch('/student/discuss/comment/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:body,reply_to:reply})}).then(r=>r.json());alert(d.success?'回复成功':(d.error||'回复失败'));if(d.success){await openPost(id);let c=await getJson('/student/discuss/my-comments');COMMENTS=c.comments||[]}}
async function deleteTopic(id){if(!confirm('确认删除这个问题？'))return;let d=await fetch('/student/discuss/post/delete/'+encodeURIComponent(id),{method:'POST'}).then(r=>r.json());alert(d.success?'已删除':(d.error||'删除失败'));if(d.success)discuss()}async function deleteComment(cid,pid){if(!confirm('确认删除这条评论？'))return;let d=await fetch('/student/discuss/comment/delete/'+encodeURIComponent(cid),{method:'POST'}).then(r=>r.json());alert(d.success?'已删除':(d.error||'删除失败'));if(d.success)openPost(pid)}
async function records(){var d=await getJson('/student/records/data'),s=d.summary||{},groups=d.groups||[];app.innerHTML='<div class="grid"><div class="stat"><span>视频学习</span><b>'+(s.video||0)+'</b></div><div class="stat"><span>文档学习</span><b>'+(s.document||0)+'</b></div><div class="stat"><span>本周记录</span><b>'+(s.week||0)+'</b></div><div class="stat"><span>总记录</span><b>'+(s.total||0)+'</b></div></div><div class="card"><h2>学习记录</h2>'+(groups.map(function(g){return '<details class="chapter" open><summary>'+esc(g.date)+' · '+g.items.length+' 条</summary>'+g.items.map(function(r){return '<div class="record-card"><span class="tag">'+esc(typeText(r.type))+'</span><div><b>'+esc(r.name)+'</b><div class="muted">对应知识点：'+esc(r.knowledge_point||'')+'</div></div><div class="muted">'+esc(r.time||'')+'</div></div>'}).join('')+'</details>'}).join('')||'<div class="empty">暂无学习记录</div>')+'</div>'}
if(PAGE==='dashboard')dashboard();if(PAGE==='path')pathPage();if(PAGE==='resources')resourcesPage();if(PAGE==='mastery')mastery();if(PAGE==='graph')graphPage();if(PAGE==='discuss')discuss();if(PAGE==='records')records();

<script>
function qDifficultyName(d){return d==='easy'?'简单':(d==='hard'?'困难':'中等')}
function qTypeName(t){return t==='multiple_choice'?'多选':(t==='judge'?'判断':(t==='blank'?'填空':'单选'))}
function renderQuestionCard(q,resId){let opts=(q.options||[]).map(o=>'<label style="display:block;margin:6px 0"><input name="ans_'+esc(q.id)+'" '+(q.type==='multiple_choice'?'type="checkbox"':'type="radio"')+' value="'+esc(String(o).split('.')[0])+'"> '+esc(o)+'</label>').join('');if(q.type==='blank')opts='<input class="select" id="blank_'+esc(q.id)+'" placeholder="填写答案">';return '<div class="res-card question-card" data-q="'+esc(q.id)+'"><div class="res-title">'+esc(q.question||q.title)+'</div><span class="tag">'+qTypeName(q.type)+'</span><span class="tag">'+qDifficultyName(q.difficulty)+'</span><span class="tag">'+esc(q.knowledge_point||q.knowledge_name||'')+'</span><div style="margin-top:8px">'+opts+'</div><button class="btn" style="margin-top:8px" onclick="submitQuestion(\''+esc(q.id)+'\',\''+esc(resId||'')+'\')">提交答案</button><div class="muted answer-result" style="margin-top:8px"></div></div>'}
async function submitQuestion(qid,resId){let card=document.querySelector('[data-q="'+CSS.escape(qid)+'"]'),vals=[];card.querySelectorAll('input[name="ans_'+CSS.escape(qid)+'"]:checked').forEach(i=>vals.push(i.value));let b=card.querySelector('#blank_'+CSS.escape(qid));if(b)vals=[b.value];let d=await fetch('/student/questions/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question_id:qid,answer:vals,resource_id:resId})}).then(r=>r.json());let box=card.querySelector('.answer-result');box.innerHTML=d.success?(d.correct?'<span class="tag ok">回答正确</span>':'<span class="tag bad">回答错误</span>')+' 正确答案：'+esc(d.correct_answer)+'<br>解析：'+esc(d.analysis||'暂无解析')+'<br>掌握度：'+Math.round((d.mastery_before||0)*100)+'% → '+Math.round((d.mastery_after||0)*100)+'%':esc(d.error||'提交失败')}
async function completeResExt(rid,btn){btn.disabled=true;let d=await fetch('/student/resource/'+encodeURIComponent(rid)+'/complete',{method:'POST'}).then(r=>r.json());let box=btn.parentElement.querySelector('.after')||btn.parentElement.appendChild(document.createElement('div'));box.className='muted after';if(!d.success){box.textContent=d.error||'记录失败';return}btn.textContent='已完成学习';box.innerHTML='已完成学习，推荐练一练：<div class="res-grid" style="margin-top:8px">'+(d.recommend_questions||[]).map(q=>renderQuestionCard(q,rid)).join('')+'</div>'}
async function enhancedResourcesPage(){const data=await getJson('/student/resources/data');let ch='全部',type='全部',status='全部',q='';function draw(){let all=data.resources||[];let chapters=[...new Set(all.map(r=>r.chapter_label||r.chapter_name||'未分类'))];let list=all.filter(r=>(ch==='全部'||(r.chapter_label||r.chapter_name||'未分类')===ch)&&(type==='全部'||r.type===type)&&(status==='全部'||(status==='已完成'?r.completed:!r.completed))&&(!q||[r.name,r.title,r.knowledge_point,r.teacher_name].join(' ').includes(q)));app.innerHTML='<div class="panel panel-pad"><div class="section-head"><div><h2>学习资源库</h2><div class="muted">按章节、类型、完成状态筛选资源；看完后可以直接练习。</div></div></div><div class="toolbar"><select class="select" onchange="ch=this.value;draw()"><option>全部</option>'+chapters.map(x=>'<option '+(x===ch?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select><select class="select" onchange="type=this.value;draw()"><option>全部</option>'+[...new Set(all.map(r=>r.type||'资源'))].map(x=>'<option '+(x===type?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select><select class="select" onchange="status=this.value;draw()"><option>全部</option><option>未完成</option><option>已完成</option></select><input class="search" placeholder="搜索资源、知识点、教师" oninput="clearTimeout(window._resDebounce);window._resDebounce=setTimeout(function(){q=this.value;draw()}.bind(this),300)"></div></div><div class="panel panel-pad"><div class="res-grid">'+list.map(r=>'<div class="res-card"><div class="res-title">'+esc(r.title||r.name)+'</div><span class="tag">'+esc(r.type||'资源')+'</span><span class="tag">'+esc(r.teacher_name||'未标注')+'</span><span class="tag">推荐度 '+Math.round((r.recommend_score||0)*100)+'%</span><div class="muted">'+esc(r.knowledge_point||'未绑定知识点')+'</div><div class="muted">'+esc(r.explain||'')+'</div><a class="btn light" target="_blank" href="'+resAction(r)+'">查看</a> <button class="btn green" onclick="completeResExt(\''+esc(r.resource_id||r.name)+'\',this)">'+(r.completed?'已完成学习':'我已看完')+'</button> <button class="btn light" onclick="loadResourceQuestions(\''+esc(r.resource_id||r.name)+'\',this)">看完后练一练</button><div class="after"></div></div>').join('')+'</div></div>'}window.draw=draw;draw()}
async function loadResourceQuestions(rid,btn){let d=await fetch('/student/resource/'+encodeURIComponent(rid)+'/questions?limit=5').then(r=>r.json());let box=btn.parentElement.querySelector('.after');box.innerHTML='<div class="res-grid" style="margin-top:8px">'+(d.questions||[]).map(q=>renderQuestionCard(q,rid)).join('')+'</div>'}
async function enhancedPathPage(){const data=await getJson('/student/path/data'+(TARGET?'?target_kp='+encodeURIComponent(TARGET):''));const steps=(data.learning_path&&data.learning_path.length?data.learning_path:data.fallback_path)||[];app.innerHTML='<div class="panel panel-pad"><h2>学习资源推荐</h2><div class="muted">每个节点提供推荐资源和立即练习。</div></div><div class="panel panel-pad">'+steps.map((s,i)=>'<div class="path-item"><div class="step-no">'+(i+1)+'</div><div><h3>'+esc(s.name)+'</h3><span class="tag">掌握度 '+Math.round((s.score||0)*100)+'%</span><div class="muted">'+esc(s.reason||'')+'</div><button class="btn light" onclick="loadStepQuestions(\''+esc(s.name)+'\',this)">立即练一练</button><div class="resource-strip">'+(s.resources||[]).map(r=>'<div class="mini-res"><div class="res-title">'+esc(r.title||r.name)+'</div><span class="tag">'+esc(r.type||'资源')+'</span><a class="btn light" href="'+resAction(r)+'">查看</a> <button class="btn green" onclick="completeResExt(\''+esc(r.resource_id||r.name)+'\',this)">我已看完</button><div class="after"></div></div>').join('')+'</div><div class="after"></div></div></div>').join('')+'</div>'}

async function wrongPage(){let d=await getJson('/student/wrong-questions/data');let qs=(d.questions||[]).filter(q=>(q.consecutive_correct||0)<2);let mastered=(d.questions||[]).filter(q=>(q.consecutive_correct||0)>=2).length;let multiWrong=qs.filter(function(q){return(q.wrong_count||0)>=2}).length;app.innerHTML='<div class="grid"><div class="stat"><span>错题总数</span><b>'+qs.length+'</b><span class="muted">需复练的错题</span></div><div class="stat"><span>已掌握</span><b>'+mastered+'</b><span class="muted">连续做对2次，已移出</span></div><div class="stat"><span>多次错误</span><b>'+multiWrong+'</b><span class="muted">错误2次及以上</span></div></div><div class="card"><div class="toolbar"><input class="search" id="wrongSearch" placeholder="搜索题干" oninput="renderWrong()"><select id="wrongFilter" onchange="renderWrong()"><option value="all">全部</option><option value="err1">错误1次</option><option value="err2">错误2次及以上</option><option value="corr1">做对1次</option></select></div><div id="wrongList"></div></div>';window.WRONG_ALL=qs;window.renderWrong=function(){let q=document.getElementById("wrongSearch").value||"";q=q.toLowerCase();let f=document.getElementById("wrongFilter").value;let list=(window.WRONG_ALL||[]).filter(function(x){return!q||[x.question,x.chapter_name,x.knowledge_point].join(" ").toLowerCase().includes(q)});if(f==="err1")list=list.filter(function(x){return(x.wrong_count||0)===1&&(x.consecutive_correct||0)===0});else if(f==="err2")list=list.filter(function(x){return(x.wrong_count||0)>=2});else if(f==="corr1")list=list.filter(function(x){return(x.consecutive_correct||0)===1});document.getElementById("wrongList").innerHTML=list.map(function(x){let tags=[],lb='',tc='';if((x.wrong_count||0)>=3)tags.push('<span class="tag bad">多次错误</span>');if((x.consecutive_correct||0)>0){lb='做对1次';tc='ok'}else if((x.wrong_count||0)>=2){lb='错误2次';tc='bad'}else{lb='错误1次';tc='bad'}return'<div class="res-card"><b>'+esc(x.question||x.title)+'</b><span class="tag">'+esc(x.chapter_name||'')+'</span><span class="tag">'+esc(x.knowledge_point||'')+'</span><span class="tag bad">错误 '+(x.wrong_count||0)+' 次</span><span class="tag '+tc+'">'+lb+'</span>'+tags.join('')+renderQuestionCard(x,'')+'<button class="btn light" onclick="removeWrong(\''+esc(x.id)+'\')">移出错题集</button></div>'}).join('')||'<div class="empty">暂无错题</div>'};renderWrong()}
async function removeWrong(qid){await fetch('/student/wrong-questions/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question_id:qid})});wrongPage()}
if(PAGE==='resources')enhancedResourcesPage();if(PAGE==='path')enhancedPathPage();if(PAGE==='wrong')wrongPage();
