<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>知识图谱完整调试</title>
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.2/standalone/umd/vis-network.min.js"></script>
    <style>
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        #mynetwork { width: 100%; height: 700px; border: 2px solid #ddd; background: white; margin-top: 20px; }
        .info { background: #fff; padding: 15px; margin: 10px 0; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        pre { background: #f8f8f8; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 知识图谱完整数据测试</h1>
    <div id="info" class="info">正在加载...</div>
    <div id="mynetwork"></div>

    <script>
        window.onerror = function(msg, url, line, col, error) {
            var info = document.getElementById('info');
            info.innerHTML = '<span class="error">❌ JavaScript错误!</span><br>' +
                '<strong>消息:</strong> ' + msg + '<br>' +
                '<strong>位置:</strong> 行 ' + line + ', 列 ' + col + '<br>' +
                '<strong>详情:</strong><pre>' + (error ? error.stack : 'N/A') + '</pre>';
            console.error('❌ Error:', arguments);
            return false;
        };

        document.addEventListener('DOMContentLoaded', function() {
            try {
                console.log('🚀 开始初始化...');

                // 检查vis库
                if (typeof vis === 'undefined') {
                    throw new Error('❌ vis.js库未加载! 请检查网络连接');
                }
                console.log('✅ vis.js库已加载, 版本信息:', vis);

                // 使用实际的graphData（从debug_graph.html提取）
                var graphData = {"nodes": [{"id": "操作系统", "label": "操作系统", "group": "root", "mastery": 0.0}, {"id": "第1章 操作系统概述", "label": "第1章 操作系统概述", "group": "chapter", "mastery": 0.0}, {"id": "第2章 进程与线程", "label": "第2章 进程与线程", "group": "chapter", "mastery": 0.0}, {"id": "第3章 互斥与同步", "label": "第3章 互斥与同步", "group": "chapter", "mastery": 0.0}, {"id": "1.1 操作系统的定义", "label": "1.1 操作系统的定义", "group": "section", "mastery": 0.0}], "edges": [{"from": "操作系统", "to": "第1章 操作系统概述", "type": "包含"}, {"from": "操作系统", "to": "第2章 进程与线程", "type": "包含"}, {"from": "操作系统", "to": "第3章 互斥与同步", "type": "包含"}, {"from": "第1章 操作系统概述", "to": "1.1 操作系统的定义", "type": "包含"}]};

                console.log('✅ graphData加载完成:', graphData.nodes.length, '个节点,', graphData.edges.length, '条边');

                // 显示基本信息
                document.getElementById('info').innerHTML =
                    '<span class="success">✅ 数据加载成功</span><br>' +
                    '<strong>节点数:</strong> ' + graphData.nodes.length + '<br>' +
                    '<strong>边数:</strong> ' + graphData.edges.length + '<br>' +
                    '<strong>vis.js版本:</strong> 已加载<br><br>' +
                    '<em>如果下方显示空白或有错误，请查看浏览器控制台(F12)</em>';

                // 创建节点
                var nodesArr = graphData.nodes.map(function(n, idx) {
                    console.log('处理节点', idx, ':', n);
                    return {
                        id: n.id,
                        label: n.label || n.id,
                        group: n.group,
                        mastery: n.mastery || 0,
                        shape: 'circle',
                        size: n.group === 'root' ? 80 : (n.group === 'chapter' ? 60 : 40),
                        color: {
                            background: n.group === 'root' ? '#3498db' : '#ecf0f1',
                            border: n.group === 'root' ? '#2980b9' : '#bdc3c7'
                        },
                        font: { size: 11, color: '#333' },
                        borderWidth: 2
                    };
                });

                console.log('✅ 节点数组创建完成:', nodesArr.length, '个');

                // 创建边
                var edgesArr = graphData.edges.map(function(e, idx) {
                    console.log('处理边', idx, ':', e);
                    return {
                        from: e.from,
                        to: e.to,
                        arrows: 'to',
                        color: { color: '#95a5a6' },
                        width: 2
                    };
                });

                console.log('✅ 边数组创建完成:', edgesArr.length, '条');

                // 创建DataSet
                var nodes = new vis.DataSet(nodesArr);
                var edges = new vis.DataSet(edgesArr);
                var data = { nodes: nodes, edges: edges };

                console.log('✅ DataSet创建完成');

                // 配置选项
                var options = {
                    physics: {
                        enabled: true,
                        solver: 'forceAtlas2Based',
                        forceAtlas2Based: {
                            gravitationalConstant: -200,
                            centralGravity: 0.01,
                            springLength: 150,
                            springConstant: 0.05,
                            damping: 0.3
                        },
                        stabilization: { iterations: 100 }
                    },
                    interaction: {
                        hover: true,
                        zoomView: true,
                        dragView: true
                    }
                };

                console.log('✅ 选项配置完成');

                // 获取容器
                var container = document.getElementById('mynetwork');
                if (!container) {
                    throw new Error('❌ 找不到容器元素 #mynetwork!');
                }

                console.log('✅ 容器找到，尺寸:', container.offsetWidth, 'x', container.offsetHeight);

                // 创建网络
                var network = new vis.Network(container, data, options);

                console.log('✅ 网络创建成功!');

                // 监听稳定事件
                network.on("stabilized", function(params) {
                    console.log('✅ 图谱稳定完成, 迭代次数:', params.iterations);
                    document.getElementById('info').innerHTML +=
                        '<br><span class="success">✅ 知识图谱渲染完成!</span>';
                });

                // 监听错误
                network.on("error", function(error) {
                    console.error('❌ 网络错误:', error);
                    document.getElementById('info').innerHTML +=
                        '<br><span class="error">❌ 渲染错误: ' + error + '</span>';
                });

            } catch(e) {
                console.error('❌ 执行错误:', e);
                document.getElementById('info').innerHTML +=
                    '<br><span class="error">❌ 执行失败: ' + e.message + '</span><br>' +
                    '<pre>' + e.stack + '</pre>';
            }
        });
    </script>
</body>
</html>
